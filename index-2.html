<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لکی ڈرا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--teal:#0E4D4A;--gold:#F2A900;--ink:#14201F;--mist:#E6F0EE;--white:#FFFFFF;--err:#B3261E}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Nastaliq Urdu',system-ui,sans-serif;background:var(--mist);color:var(--ink);line-height:2.1;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 0;color:var(--teal)}
.sub{margin:0 0 20px;font-size:.95rem;opacity:.75}
.card{background:var(--white);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-size:.9rem;margin-top:6px}
input{width:100%;font:inherit;padding:10px 12px;border:1.5px solid #B9CCC9;border-radius:10px;background:#fff;direction:ltr;text-align:left}
input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 18px;cursor:pointer;background:var(--teal);color:#fff;width:100%;margin-top:14px}
button.gold{background:var(--gold);color:var(--ink)}
button.plain{background:transparent;color:var(--teal);width:auto;margin:0;padding:0 4px;text-decoration:underline}
button:disabled{opacity:.55}
.ticket{position:relative;background:var(--teal);color:#fff;border-radius:14px;padding:20px 20px 22px;margin-bottom:16px}
.ticket::before,.ticket::after{content:"";position:absolute;top:58%;width:22px;height:22px;background:var(--mist);border-radius:50%}
.ticket::before{right:-11px}.ticket::after{left:-11px}
.ticket .tag{font-size:.85rem;opacity:.8}
.ticket .prize{font-size:1.35rem;font-weight:700;margin:2px 0 0}
.ticket hr{border:0;border-top:2px dashed rgba(255,255,255,.4);margin:14px 6px}
.msg{min-height:1.5em;margin:12px 0 0;font-size:.95rem}
.msg.err{color:#FFB4AB;font-weight:700}.msg.ok{color:var(--gold);font-weight:700}
#authMsg.err{color:var(--err)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.top span{direction:ltr;opacity:.7}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>لکی ڈرا</h1>
  <p class="sub">مفت شمولیت، روزانہ قرعہ اندازی</p>

  <section id="auth" class="card">
    <label for="email">ای میل</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="pass" style="margin-top:12px">پاسورڈ</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button id="loginBtn">لاگ اِن کریں</button>
    <p id="authMsg" class="msg" role="status"></p>
  </section>

  <section id="app" class="hidden">
    <div class="top card" style="padding:6px 16px">
      <span id="who"></span>
      <button id="logoutBtn" class="plain">لاگ آؤٹ</button>
    </div>

    <div class="ticket">
      <div class="tag">آج کا انعام</div>
      <div class="prize" id="prizeName">لوڈ ہو رہا ہے…</div>
      <hr>
      <button id="enterBtn" class="gold" style="margin-top:0">قرعہ اندازی میں شامل ہوں</button>
      <p id="enterMsg" class="msg" role="status" style="margin-bottom:0"></p>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://zuvtelsajwojdbdwwezp.supabase.co";
const SUPABASE_KEY = "sb_publishable_yN4URsyuhGnKlllkIFq8HA_C2noWQVW";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
function say(el, text, kind){ el.textContent = text; el.className = "msg " + (kind||""); }

async function showState(){
  const { data:{ session } } = await db.auth.getSession();
  $("auth").classList.toggle("hidden", !!session);
  $("app").classList.toggle("hidden", !session);
  if(session){ $("who").textContent = session.user.email; loadPrize(); }
}

async function loadPrize(){
  const { data, error } = await db.from("prizes").select("*").limit(1);
  if(error || !data || !data.length){
    $("prizeName").textContent = "آج کا انعام";
    if(error) say($("enterMsg"), "انعام کی تفصیل نہیں ملی: " + error.message, "err");
    return;
  }
  const p = data[0];
  $("prizeName").textContent = p.name || p.title || p.prize_name || "آج کا انعام";
}

$("loginBtn").onclick = async () => {
  const btn = $("loginBtn"); btn.disabled = true;
  say($("authMsg"), "لاگ اِن ہو رہا ہے…");
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("جواب نہیں آیا، دوبارہ کوشش کریں")), 15000));
    const { error } = await Promise.race([
      db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value }),
      timeout
    ]);
    if(error){ say($("authMsg"), "لاگ اِن نہیں ہو سکا: " + error.message, "err"); return; }
    say($("authMsg"), "");
    showState();
  } catch(e){
    say($("authMsg"), "لاگ اِن نہیں ہو سکا: " + e.message, "err");
  } finally {
    btn.disabled = false;
  }
};

$("logoutBtn").onclick = async () => { await db.auth.signOut(); showState(); };

$("enterBtn").onclick = async () => {
  const btn = $("enterBtn"); btn.disabled = true;
  say($("enterMsg"), "");
  const { data, error } = await db.rpc("enter_draw");
  btn.disabled = false;
  if(error){ say($("enterMsg"), "شمولیت نہیں ہو سکی: " + error.message, "err"); return; }
  say($("enterMsg"), "آپ کی شمولیت درج ہو گئی۔", "ok");
};

db.auth.onAuthStateChange(() => { setTimeout(showState, 0); });
showState();
</script>
</body>
</html>
